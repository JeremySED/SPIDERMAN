<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Spiderverso: Multiverso</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Roboto Condensed', sans-serif; background:#000; color:#fff; overflow-x:hidden; position:relative; }

canvas#particles { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

.container {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    width:100%;
    padding:50px 20px;
    z-index:1;
}

/* Título principal con efecto épico */
.main-title {
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(3em,6vw,6em);
    color:#FFEE00;
    text-shadow: 0 0 20px #FFEE00, 0 0 40px #FFD700, 0 0 60px #FFEE00;
    margin-bottom:50px;
    text-align:center;
    opacity:0;
    transform: scale(0.8);
    animation: titleIntro 2s forwards, glow 2s infinite alternate;
}

/* Glow animación */
@keyframes glow {
    0% { text-shadow: 0 0 20px #FFEE00, 0 0 40px #FFD700, 0 0 60px #FFEE00; }
    50% { text-shadow: 0 0 40px #FFEE00, 0 0 60px #FFD700, 0 0 80px #FFEE00; }
    100% { text-shadow: 0 0 20px #FFEE00, 0 0 40px #FFD700, 0 0 60px #FFEE00; }
}

@keyframes titleIntro {
    0% { opacity:0; transform: scale(0.8) translateY(-50px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
}

/* Tarjetas multiverso */
.cards {
    display:flex;
    flex-wrap:wrap;
    gap:30px;
    justify-content:center;
    opacity:0;
    animation: fadeInCards 1.5s 1s forwards;
}

@keyframes fadeInCards {
    0% { opacity:0; transform: translateY(50px); }
    100% { opacity:1; transform: translateY(0); }
}

.card {
    position:relative;
    width:300px;
    height:450px;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
    transition: transform 0.5s, box-shadow 0.5s;
}

.card:hover {
    transform: scale(1.05) rotateY(5deg);
    box-shadow: 0 0 50px #FFEE00;
}

.card img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition: transform 0.5s;
}

.card:hover img {
    transform: scale(1.15);
}

.card .card-title {
    position:absolute;
    bottom:20px;
    left:20px;
    font-family:'Montserrat', sans-serif;
    font-weight:900;
    font-size:clamp(1.5em,3vw,2.5em);
    color:#FFEE00;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
    opacity:0;
    animation: cardTitleFade 1s forwards;
    animation-delay: 1s;
}

@keyframes cardTitleFade {
    0% { opacity:0; transform: translateY(20px); }
    100% { opacity:1; transform: translateY(0); }
}

/* Botones de navegación */
.nav-buttons {
    margin-top:50px;
    display:flex;
    gap:20px;
    opacity:0;
    animation: fadeInNav 1s 2s forwards;
}

.nav-buttons a {
    padding:15px 30px;
    background: #FFEE00;
    color:#000;
    font-weight:700;
    border-radius:10px;
    text-transform:uppercase;
    transition: background 0.3s, transform 0.3s;
}

.nav-buttons a:hover {
    background: #FFD700;
    transform: scale(1.1);
}

@keyframes fadeInNav {
    0% { opacity:0; transform: translateY(20px); }
    100% { opacity:1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- Canvas de partículas de energía -->
<canvas id="particles"></canvas>

<div class="container">
    <div class="main-title">Spiderverso: El Multiverso</div>

    <div class="cards">
        <a href="peter.html" class="card">
            <img src="peter/peter1.png" alt="Peter Parker">
            <div class="card-title">Peter Parker</div>
        </a>

        <a href="miles.html" class="card">
            <img src="miles/miles1.png" alt="Miles Morales">
            <div class="card-title">Miles Morales</div>
        </a>

        <a href="noir.html" class="card">
            <img src="noir/img1.jpg" alt="Spider Noir">
            <div class="card-title">Spider Noir</div>
        </a>
    </div>

    <div class="nav-buttons">
        <a href="peter.html">Peter Parker</a>
        <a href="miles.html">Miles Morales</a>
        <a href="noir.html">Spider Noir</a>
    </div>
</div>

<script>
// Partículas tipo multiverso
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<100;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        radius: Math.random()*2 + 1,
        speedX: (Math.random()-0.5)*0.5,
        speedY: (Math.random()-0.5)*0.5,
        alpha: Math.random()*0.7+0.3
    });
}

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,0,${p.alpha})`;
        ctx.fill();
        p.x += p.speedX;
        p.y += p.speedY;

        if(p.x < 0) p.x = canvas.width;
        if(p.x > canvas.width) p.x = 0;
        if(p.y < 0) p.y = canvas.height;
        if(p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
