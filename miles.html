<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Spiderverso - Miles Morales</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Roboto Condensed', sans-serif;
    position:relative;
    background-color:#000;
}

/* Contenedor de scroll */
#content-wrapper {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    overflow-y:scroll;
    overflow-x:hidden;
    scroll-behavior:smooth;
    -ms-overflow-style:none;
    scrollbar-width:none;
    color:white;
    padding-right:20px;
    padding-bottom:20vh;
    background-color:#1a1a1a;
    background-image:url("miles/fondo2.jpg");
    background-attachment:fixed;
    background-size:cover;
    background-position:center;
}

#content-wrapper::-webkit-scrollbar { width:0px; background:transparent; }

/* Fondo animado página 1 */
.fondo {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background: url("miles/fondo1.jpg") no-repeat center center;
    background-size: cover;
    filter: blur(6px) brightness(0.7);
    z-index:1;
    animation: moverFondo 15s ease-in-out infinite alternate;
}

@keyframes moverFondo { 0%{transform:scale(1);} 100%{transform:scale(1.05);} }

/* Imagen tipo spiderman */
.spiderman {
    position: fixed;
    right: 50%;
    top: 50%;
    transform: translateY(-50%) rotateY(5deg);
    height: 100vh;
    width: auto;
    z-index: 3;
    filter: drop-shadow(-30px 20px 50px rgba(0,0,0,0.9))
            drop-shadow(-15px 10px 25px rgba(0,0,0,0.7));
    opacity: 1;
    transition: opacity 0.3s ease;
}

/* Título página 1 */
.titulo {
    position: absolute;
    top: 50vh;
    left: 40%;
    transform: translateY(-50%);
    width: clamp(600px, 70vw, 1000px);
    z-index: 2;
    filter: drop-shadow(5px 5px 10px rgba(255,255,0,0.8))
            drop-shadow(2px 2px 5px rgba(0,0,0,0.8)) brightness(1);
    opacity: 0;
    transition: opacity 0.5s, transform 0s;
}

@keyframes title-enter-animation {
    0% { opacity:0; right:-100%; }
    100% { opacity:1; right:5%; }
}

@keyframes title-exit-animation {
    0% { opacity:1; right:5%; }
    100% { opacity:0; right:-100%; }
}

.titulo.entering { animation: title-enter-animation 0.7s cubic-bezier(0.23,1,0.32,1) forwards; }
.titulo.exiting { animation: title-exit-animation 0.5s ease-out forwards; }

/* Espacio inicial */
.initial-spacer { height:100vh; background-color:#000; }

/* Página 2 */
.second-page {
    position: relative;
    height:100vh;
    display: flex;
    justify-content:flex-end;
    align-items: center;
    padding-right: 5%;
    z-index:1;
}

.second-page::before {
    content:'';
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: inherit;
    filter: blur(2px);
    z-index:-1;
}

.epic-intro-text {
    font-family:'Montserrat', sans-serif;
    font-size: clamp(3em,6vw,4.5em);
    font-weight:900;
    color:#FFEE00;
    text-shadow: 10px 10px 20px rgba(0,0,0,0.9),5px 5px 10px rgba(0,0,0,0.7);
    text-align:right;
    max-width:700px;
    letter-spacing:2px;
    line-height:1.1;
    text-transform:uppercase;
    opacity:0;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    0%{text-shadow:10px 10px 20px rgba(0,0,0,0.9),5px 5px 10px rgba(0,0,0,0.7),0 0 20px #FFEE00;}
    50%{text-shadow:10px 10px 20px rgba(0,0,0,0.9),5px 5px 10px rgba(0,0,0,0.7),0 0 40px #FFEE00;}
    100%{text-shadow:10px 10px 20px rgba(0,0,0,0.9),5px 5px 10px rgba(0,0,0,0.7),0 0 20px #FFEE00;}
}

@keyframes epic-text-enter-animation {
    0%{opacity:0; transform:translateX(100%) translateZ(0); filter:blur(5px);}
    100%{opacity:1; transform:translateX(0) translateZ(0); filter:blur(0);}
}
@keyframes epic-text-exit-animation {
    0%{opacity:1; transform:translateX(0) translateZ(0); filter:blur(0);}
    100%{opacity:0; transform:translateX(100%) translateZ(0); filter:blur(5px);}
}
.epic-intro-text.entering { animation: epic-text-enter-animation 0.7s cubic-bezier(0.23,1,0.32,1) forwards, glow 2s infinite alternate; }
.epic-intro-text.exiting { animation: epic-text-exit-animation 0.4s ease-out forwards; }

/* Página 3 */
.third-page {
    position: relative;
    height:100vh;
    background: url("miles/fondo3.jpg") no-repeat center center;
    background-size: cover;
    z-index:1;
    overflow: hidden;
}

/* Miles izquierda */
.third-page .miles-img {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 45%;
    height: auto;
    z-index: 2;
}

/* Texto abajo a la derecha */
.third-page .titulo-derecha {
    position: absolute;
    bottom: 20px;
    right: 20px;
    font-family:'Montserrat', sans-serif;
    font-size: clamp(2.5em,5vw,4em);
    font-weight:900;
    color: #FFEE00;
    text-shadow: 5px 5px 15px rgba(0,0,0,0.8);
    opacity:1;
    z-index:3;
    text-align: right;
}
</style>
</head>
<body>

<div id="content-wrapper">
    <!-- Página 1 -->
    <div class="fondo"></div>
    <img src="miles/titulo1.png" alt="Título Miles Morales" class="titulo" id="title-element">
    <div class="initial-spacer"></div>

    <!-- Página 2 -->
    <div class="second-page">
        <div class="epic-intro-text" id="epic-intro-text">
            "Con grandes poderes, surgen grandes desafíos."
        </div>
    </div>

    <!-- Página 3 -->
    <div class="third-page">
        <img src="miles/miles1.png" class="miles-img" alt="Miles Morales">
        <div class="titulo-derecha">Miles Morales: El héroe del Spiderverso</div>
    </div>

    <div style="height:10vh;"></div>
</div>

<img src="miles/miles1.png" alt="Miles Morales" class="spiderman" id="spiderman">

<script>
const scrollContainer = document.getElementById('content-wrapper');
const titleElement = document.getElementById('title-element');
const epicIntroText = document.getElementById('epic-intro-text'); 
const spiderman = document.getElementById('spiderman');
const scrollAmount = window.innerHeight; 
let isScrolling = false;
let isTitleVisible = false;
let isEpicTextVisible = false; 

function animateTitleIn(){ if(!isTitleVisible){ titleElement.classList.remove('exiting'); titleElement.classList.add('entering'); isTitleVisible=true;} }
function animateTitleOut(cb){ if(isTitleVisible){ titleElement.classList.remove('entering'); titleElement.classList.add('exiting'); isTitleVisible=false; setTimeout(cb,200);}else{cb();} }
function animateEpicTextIn(){ if(!isEpicTextVisible){ epicIntroText.classList.remove('exiting'); epicIntroText.classList.add('entering'); isEpicTextVisible=true;} }
function animateEpicTextOut(cb){ if(isEpicTextVisible){ epicIntroText.classList.remove('entering'); epicIntroText.classList.add('exiting'); isEpicTextVisible=false; setTimeout(cb,400);}else{epicIntroText.style.opacity='0'; epicIntroText.style.transform='translateX(100%)'; cb();}}

scrollContainer.addEventListener('wheel', (e)=>{
    e.preventDefault();
    if(isScrolling) return;
    const currentScroll = scrollContainer.scrollTop;

    // Página 1 -> 2
    if(e.deltaY>0 && currentScroll<scrollAmount*0.1){
        isScrolling=true;
        animateTitleOut(()=>{
            scrollContainer.scrollTo({top:scrollAmount, behavior:'smooth'});
            animateEpicTextIn();
            spiderman.style.opacity='1';
            setTimeout(()=>{isScrolling=false;},800);
        });
    }
    // Página 2 -> 1
    else if(e.deltaY<0 && currentScroll>scrollAmount*0.9 && currentScroll<=scrollAmount*1.05){
        isScrolling=true;
        animateEpicTextOut(()=>{
            scrollContainer.scrollTo({top:0, behavior:'smooth'});
            setTimeout(()=>{animateTitleIn(); spiderman.style.opacity='1';},150);
            setTimeout(()=>{isScrolling=false;},800);
        });
    }
    // Página 2 -> 3
    else if(e.deltaY>0 && currentScroll>=scrollAmount*0.95 && currentScroll<scrollAmount*2){
        isScrolling=true;
        scrollContainer.scrollTo({top:scrollAmount*2, behavior:'smooth'});
        spiderman.style.opacity='0';
        setTimeout(()=>{isScrolling=false;},800);
    }
    // Página 3 -> 2
    else if(e.deltaY<0 && currentScroll>=scrollAmount*1.95){
        isScrolling=true;
        scrollContainer.scrollTo({top:scrollAmount, behavior:'smooth'});
        spiderman.style.opacity='1';
        setTimeout(()=>{isScrolling=false;},800);
    }
});

window.onload=animateTitleIn;
</script>

</body>
</html>
