<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Spider Noir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:'Roboto Condensed', sans-serif;
    position:relative;
    background-color:#000;
}

/* Contenedor de scroll */
#content-wrapper {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    overflow-y:scroll;
    overflow-x:hidden;
    scroll-behavior:smooth;
    -ms-overflow-style:none;
    scrollbar-width:none;
    color:white;
    background-color:#1a1a1a;
}

#content-wrapper::-webkit-scrollbar { width:0px; background:transparent; }

/* Fondo página 1 */
.fondo {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background: url("noir/fondo1.jpg") no-repeat center center;
    background-size: cover;
    filter: blur(6px) brightness(0.7);
    z-index:1;
    animation: moverFondo 15s ease-in-out infinite alternate;
}

@keyframes moverFondo { 0%{transform:scale(1);} 100%{transform:scale(1.05);} }

/* Imagen tipo Spider Noir */
.spiderman {
    position: fixed;
    left: 5%;
    top: 50%;
    transform: translateY(-50%);
    height: 100vh;
    width: auto;
    z-index: 3;
    filter: drop-shadow(-30px 20px 50px rgba(0,0,0,0.9))
            drop-shadow(-15px 10px 25px rgba(0,0,0,0.7));
    opacity: 1;
    transition: opacity 0.3s ease;
}

/* Título página 1 */
.titulo {
    position: absolute;
    top: 50vh;
    left: 40%;
    transform: translateY(-50%);
    width: clamp(300px, 50vw, 600px);
    z-index: 2;
    filter: drop-shadow(5px 5px 10px rgba(255,255,255,0.8))
            drop-shadow(2px 2px 5px rgba(0,0,0,0.8)) brightness(1);
    opacity: 0;
}

@keyframes title-enter-animation {
    0% { opacity: 0; transform: translateY(-50%) translateX(100px) scale(0.9); filter: brightness(0.8); }
    50% { opacity: 0.7; transform: translateY(-50%) translateX(50px) scale(1.05); filter: brightness(1.2); }
    100% { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); filter: brightness(1); }
}

@keyframes title-exit-animation {
    0% { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); filter: brightness(1); }
    100% { opacity: 0; transform: translateY(-50%) translateX(-100px) scale(0.95); filter: brightness(0.7); }
}

.titulo.entering { animation: title-enter-animation 0.8s cubic-bezier(0.23,1,0.32,1) forwards; }
.titulo.exiting { animation: title-exit-animation 0.5s ease-out forwards; }

/* Espacio inicial */
.initial-spacer { height:100vh; background-color:#000; }

/* Página 2 */
.second-page {
    position: relative;
    height:100vh;
    display: flex;
    justify-content:flex-end;
    align-items: center;
    padding-right: 50px;
    z-index:1;
}

.second-page::before {
    content:'';
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background: inherit;
    filter: blur(2px);
    z-index:-1;
}

.epic-intro-text {
    font-family:'Montserrat', sans-serif;
    font-size: clamp(3em,6vw,4.5em);
    font-weight:900;
    color:#FFEE00;
    text-align:right;
    max-width:700px;
    letter-spacing:2px;
    line-height:1.1;
    text-transform:uppercase;
    opacity:0;
}

@keyframes epic-text-enter-animation {
    0%{opacity:0; transform:translateX(100%) translateZ(0);}
    100%{opacity:1; transform:translateX(0) translateZ(0);}
}
@keyframes epic-text-exit-animation {
    0%{opacity:1; transform:translateX(0) translateZ(0);}
    100%{opacity:0; transform:translateX(100%) translateZ(0);}
}
.epic-intro-text.entering { animation: epic-text-enter-animation 0.7s cubic-bezier(0.23,1,0.32,1) forwards; }
.epic-intro-text.exiting { animation: epic-text-exit-animation 0.4s ease-out forwards; }

/* Página 3 */
.third-page {
    position: relative;
    height:100vh;
    background: url("noir/fondo3.webp") no-repeat center center;
    background-size: cover;
    z-index:1;
    overflow: hidden;
}

.third-page .titulo-abajo {
    position: absolute;
    bottom: 10px;
    right: 20px;
    font-family:'Montserrat', sans-serif;
    font-size: clamp(2em,5vw,3em);
    font-weight:900;
    color: #FFEE00;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    opacity:0;
    animation: tituloAbajoAnim 1s forwards;
}

@keyframes tituloAbajoAnim {
    0%{ opacity:0; transform: translateY(20px); }
    100%{ opacity:1; transform: translateY(0); }
}

</style>
</head>
<body>

<div id="content-wrapper">
    <!-- Página 1 -->
    <div class="fondo"></div>
    <img src="noir/titulo1.jpg" alt="Título Spider Noir" class="titulo" id="title-element">
    <img src="noir/img1.jpg" alt="Spider Noir" class="spiderman">
    <div class="initial-spacer"></div>

    <!-- Página 2 -->
    <div class="second-page">
        <div class="epic-intro-text" id="epic-intro-text">
            "En la oscuridad, <br> un héroe surge <br> desde las sombras."
        </div>
    </div>

    <!-- Página 3 -->
    <div class="third-page">
        <div class="titulo-abajo">Spider Noir: El guardián de la noche</div>
    </div>

    <div style="height:10vh;"></div>
</div>

<script>
const scrollContainer = document.getElementById('content-wrapper');
const titleElement = document.getElementById('title-element');
const epicIntroText = document.getElementById('epic-intro-text'); 
const spiderman = document.querySelector('.spiderman');
const scrollAmount = window.innerHeight; 
let isScrolling = false;
let isTitleVisible = false;
let isEpicTextVisible = false; 

function animateTitleIn(){ 
    if(!isTitleVisible){ 
        titleElement.classList.remove('exiting'); 
        titleElement.classList.add('entering'); 
        isTitleVisible=true;
    } 
}
function animateTitleOut(cb){ 
    if(isTitleVisible){ 
        titleElement.classList.remove('entering'); 
        titleElement.classList.add('exiting'); 
        isTitleVisible=false; 
        setTimeout(cb,500);
    } else { cb(); } 
}
function animateEpicTextIn(){ 
    if(!isEpicTextVisible){ 
        epicIntroText.classList.remove('exiting'); 
        epicIntroText.classList.add('entering'); 
        isEpicTextVisible=true;
    } 
}
function animateEpicTextOut(cb){ 
    if(isEpicTextVisible){ 
        epicIntroText.classList.remove('entering'); 
        epicIntroText.classList.add('exiting'); 
        isEpicTextVisible=false; 
        setTimeout(cb,400);
    } else { cb(); }
}

scrollContainer.addEventListener('wheel', (e)=>{
    e.preventDefault();
    if(isScrolling) return;
    const currentScroll = scrollContainer.scrollTop;

    // Página 1 -> 2
    if(e.deltaY>0 && currentScroll<scrollAmount*0.1){
        isScrolling=true;
        animateTitleOut(()=>{
            scrollContainer.scrollTo({top:scrollAmount, behavior:'smooth'});
            animateEpicTextIn();
            spiderman.style.opacity='1';
            setTimeout(()=>{isScrolling=false;},800);
        });
    }
    // Página 2 -> 1
    else if(e.deltaY<0 && currentScroll>scrollAmount*0.9 && currentScroll<=scrollAmount*1.05){
        isScrolling=true;
        animateEpicTextOut(()=>{
            scrollContainer.scrollTo({top:0, behavior:'smooth'});
            setTimeout(()=>{animateTitleIn(); spiderman.style.opacity='1';},150);
            setTimeout(()=>{isScrolling=false;},800);
        });
    }
    // Página 2 -> 3
    else if(e.deltaY>0 && currentScroll>=scrollAmount*0.95 && currentScroll<scrollAmount*2){
        isScrolling=true;
        scrollContainer.scrollTo({top:scrollAmount*2, behavior:'smooth'});
        spiderman.style.opacity='0';
        setTimeout(()=>{isScrolling=false;},800);
    }
    // Página 3 -> 2
    else if(e.deltaY<0 && currentScroll>=scrollAmount*1.95){
        isScrolling=true;
        scrollContainer.scrollTo({top:scrollAmount, behavior:'smooth'});
        spiderman.style.opacity='1';
        setTimeout(()=>{isScrolling=false;},800);
    }
});

window.onload=animateTitleIn;
</script>

</body>
</html>
